name: Validate holiday website desktop and mobile
on:
  push:
    paths:
      - 'assets/css/christmas-experience.css'
      - 'assets/css/christmas-premium-2026.css'
      - 'assets/js/christmas-experience.js'
      - 'assets/js/maaiin.js'
      - 'index.html'
      - 'tours.html'
      - 'scripts/smoke-website.mjs'
      - '.github/workflows/website-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Check desktop, mobile, tours and reduced-motion
        run: node scripts/smoke-website.mjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holiday-website-smoke
          path: website-smoke/
          retention-days: 5
