plugins {
    id 'com.android.application' version '8.7.3'
}
def releaseCode = (System.getenv('TAXICMS_VERSION_CODE') ?: '1').toInteger()
def storePath = System.getenv('TAXICMS_KEYSTORE_PATH')
def storePasswordValue = System.getenv('TAXICMS_KEYSTORE_PASSWORD')
android {
    namespace 'com.taxisurfcity.cms'
    compileSdk 35
    defaultConfig {
        applicationId 'com.taxisurfcity.cms'
        minSdk 24
        targetSdk 35
        versionCode releaseCode
        versionName "1.0.${releaseCode}"
    }
    signingConfigs {
        release {
            if (storePath && storePasswordValue) {
                storeFile file(storePath)
                storePassword storePasswordValue
                keyAlias 'taxicms'
                keyPassword storePasswordValue
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
